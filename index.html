<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Property Insight</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="./vendor/fonts/fonts-editorial.css">
<style>
  :root { --ground: #f6f7f5; --ink: #0f1a16; --ink-2: #4b5a54; --line: #d5ddd8; --accent: #1f5f4a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink);
    font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; padding: 16px; }
  main { width: min(420px, 100%); background: #fff; border: 1px solid var(--line); padding: 32px 28px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p { color: var(--ink-2); font-size: .92rem; line-height: 1.5; margin: 0 0 20px; }
  label { display: block; font-size: .85rem; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; padding: 10px 12px; font: inherit; font-weight: 600; color: #fff; background: var(--ink);
    border: 0; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #bao { min-height: 1.4em; margin: 12px 0 0; font-size: .85rem; color: #9b2c2c; }
</style></head>
<body><main>
  <h1>Property Insight</h1>
  <p>Bản đồ giá chào thuê văn phòng TP.HCM. Nhập mật khẩu ghi trong CV để xem; mỗi máy chỉ cần nhập một lần.</p>
  <form id="khoa-form">
    <label for="khoa-mat-khau">Mật khẩu</label>
    <input id="khoa-mat-khau" type="password" autocomplete="current-password" required autofocus>
    <button id="khoa-nut" type="submit">Mở trang</button>
    <p id="bao" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var bao = document.getElementById('bao');
  var nut = document.getElementById('khoa-nut');
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle) {
    bao.textContent = 'Trình duyệt này không mở được trang (thiếu service worker). Dùng Chrome, Edge hoặc Safari ở cửa sổ thường.';
    nut.disabled = true; return;
  }
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  document.getElementById('khoa-form').addEventListener('submit', async function (ev) {
    ev.preventDefault(); bao.textContent = ''; nut.disabled = true; nut.textContent = 'Đang mở...';
    try {
      var tt = await (await fetch('./khoa.json', { cache: 'no-cache' })).json();
      var goc = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('khoa-mat-khau').value.trim()),
        'PBKDF2', false, ['deriveKey']);
      var khoa = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(tt.muoi), iterations: tt.vong, hash: 'SHA-256' }, goc,
        { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      var m = b64(tt.kiem);
      try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: m.slice(0, 12) }, khoa, m.slice(12)); }
      catch (e) { bao.textContent = 'Mật khẩu chưa đúng.'; nut.disabled = false; nut.textContent = 'Mở trang'; return; }
      var reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      var sw = reg.active || navigator.serviceWorker.controller;
      var raw = await crypto.subtle.exportKey('raw', khoa);
      var kenh = new MessageChannel();
      var xong = new Promise(function (ok) { kenh.port1.onmessage = function (e) { ok(e.data); }; });
      sw.postMessage({ type: 'khoa', raw: raw }, [kenh.port2]);
      var kq = await xong;
      if (kq !== 'ok') throw new Error(kq);
      location.reload();
    } catch (e) {
      bao.textContent = 'Không mở được: ' + (e && e.message ? e.message : e);
      nut.disabled = false; nut.textContent = 'Mở trang';
    }
  });
  // Link có sẵn mật khẩu (07/10, link trên CV): ...#mk=<mật khẩu>. Phần sau dấu # không gửi lên máy chủ; xoá khỏi thanh địa chỉ
  // ngay rồi tự mở khoá, nên người bấm link từ CV không phải gõ gì.
  // Cũng bắt khi trang hỏi mật khẩu đang mở sẵn mà người xem bấm link có #mk= (chỉ đổi phần sau #, trình duyệt không tải lại).
  function moTuLink() {
    var mk = new URLSearchParams(location.hash.slice(1)).get('mk');
    if (!mk) return;
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('khoa-mat-khau').value = mk;
    document.getElementById('khoa-form').requestSubmit();
  }
  window.addEventListener('hashchange', moTuLink);
  moTuLink();
})();
</script>
</body></html>
